<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你想要的我都有RYFN商城 - 加密安全傳輸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: #f8fafc; font-family: 'Inter', sans-serif; user-select: none; }
        .glass { background: rgba(15, 15, 20, 0.9); border: 1px solid rgba(251, 191, 36, 0.1); backdrop-filter: blur(25px); }
        .shop-gradient { background: linear-gradient(90deg, #fbbf24, #f59e0b, #ea580c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-send { background: linear-gradient(to right, #fbbf24, #ea580c); color: #000; font-weight: 900; letter-spacing: 2px; }
        input, select { background: #111 !important; border: 1px solid #222 !important; color: #fbbf24 !important; }
        .hidden-field { display: none; visibility: hidden; }
    </style>
</head>
<body oncontextmenu="return false;" onkeydown="return _0x_check(event);">

    <div class="min-h-screen flex flex-col items-center p-6 md:p-12">
        <header class="text-center mb-16">
            <h1 class="text-5xl md:text-7xl font-black shop-gradient italic uppercase mb-4">RYFN 商城</h1>
            <p class="text-[10px] tracking-[0.5em] text-gray-600 uppercase font-bold text-center">Secure Order Synchronization System</p>
        </header>

        <div class="w-full max-w-3xl space-y-10">
            <div class="glass p-8 rounded-[2rem] shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 right-0 p-4 opacity-10 font-black text-6xl">01</div>
                <h2 class="text-amber-500 font-bold mb-6 italic tracking-widest uppercase">Identity Verification</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <input type="text" id="_u_d" placeholder="DISCORD ID (User#0000)" class="w-full p-4 rounded-xl outline-none focus:border-amber-500 transition-all">
                    <input type="text" id="_u_g" placeholder="GMAIL ADDRESS" class="w-full p-4 rounded-xl outline-none focus:border-amber-500 transition-all">
                </div>
            </div>

            <div class="glass p-8 rounded-[2rem]">
                <h2 class="text-amber-500 font-bold mb-6 italic tracking-widest uppercase">Select Resources</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <select id="s1" class="p-4 rounded-xl"></select>
                    <select id="s2" class="p-4 rounded-xl"></select>
                    <select id="s3" class="p-4 rounded-xl"></select>
                </div>
                <button onclick="_0x_add()" class="w-full mt-6 p-4 bg-white/5 hover:bg-white/10 rounded-2xl font-black text-amber-500 border border-dashed border-amber-500/30">ADD TO CART +</button>
            </div>

            <div class="glass p-8 rounded-[2rem] border-t-2 border-amber-500/50 shadow-[0_-20px_50px_rgba(245,158,11,0.1)]">
                <div id="_cart_list" class="space-y-4 mb-10 text-center text-gray-500 italic">清單目前為空...</div>
                <button id="_0x_btn" onclick="_0x_execute()" class="btn-send w-full py-6 rounded-2xl text-2xl hidden">CONFIRM & SYNC</button>
                <p id="_0x_st" class="text-center mt-4 font-bold text-xs tracking-widest"></p>
            </div>
        </div>
    </div>

    <script>
        // --- 核心安全防護混淆 ---
        const _0x_key = ["aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9va3MvMTQ3NDY1MTI1ODAwOTY4MjAxMy8=", "Q2tRRlBhdW1RMWNCRUFrcXdqWFROYkxiendudmRMTGpvcjctbV9PRFZUdkVBTmZkWUdhTm1jbjlzWTlaUFU2NV9GckJy"];
        
        // 偵測 F12
        setInterval(() => {
            const devtools = /./;
            devtools.toString = function() {
                document.body.innerHTML = "<h1>SECURITY VIOLATION</h1>";
                window.location.href = "about:blank";
            };
            console.log(devtools);
        }, 1000);

        function _0x_check(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && e.keyCode == 85)) {
                return false;
            }
        }

        let _c = {};

        function _0x_add() {
            let f = false;
            ['s1','s2','s3'].forEach(i => {
                const v = document.getElementById(i).value;
                if(v) { _c[v] = (_c[v] || 0) + 1; document.getElementById(i).value = ""; f = true; }
            });
            if(f) _0x_render();
        }

        function _0x_render() {
            const l = document.getElementById('_cart_list');
            const b = document.getElementById('_0x_btn');
            const keys = Object.keys(_c);
            if(keys.length === 0) { l.innerHTML = "清單目前為空..."; b.classList.add('hidden'); return; }
            b.classList.remove('hidden');
            l.innerHTML = keys.map(k => `<div class="flex justify-between p-4 bg-white/5 rounded-xl border border-white/5"><span class="font-bold text-amber-500">${k}</span><span class="font-mono">x${_c[k]}</span></div>`).join('');
        }

        async function _0x_execute() {
            const u = document.getElementById('_u_d').value.trim();
            const g = document.getElementById('_u_g').value.trim();
            const s = document.getElementById('_0x_st');
            const b = document.getElementById('_0x_btn');

            if(!u.includes('#') || !g.endsWith('@gmail.com')) return alert("INVALID DATA");

            b.disabled = true;
            s.innerText = "ENCRYPTING DATA...";

            // 這裡會從混淆的字串段落重組 Webhook
            const _target = atob(_0x_key[0]) + atob(_0x_key[1]);
            const _p = {
                username: "RYFN 訂單節點",
                embeds: [{
                    title: "📦 RYFN 訂單同步成功",
                    color: 16753920,
                    fields: [
                        { name: "USER", value: `\`${u}\``, inline: true },
                        { name: "MAIL", value: `\`${g}\``, inline: true },
                        { name: "DATA", value: Object.keys(_c).map(k => `> ${k} [${_c[k]}]`).join('\n') }
                    ],
                    footer: { text: "NODE: RYFN-SECURE-GATEWAY" },
                    timestamp: new Date()
                }]
            };

            try {
                const r = await fetch(_target, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(_p) });
                if(r.ok) {
                    s.className = "text-center mt-4 text-green-500 font-bold";
                    s.innerText = "DONE: SYNCHRONIZED";
                    _c = {}; _0x_render();
                }
            } catch (e) { s.innerText = "ERROR"; b.disabled = false; }
        }

        // 初始化選單
        (function(){
            for(let i=1;i<=3;i++){
                const e = document.getElementById(`s${i}`);
                e.innerHTML = `<option value="">-- SERIES ${i} --</option>`;
                for(let j=1;j<=20;j++) e.innerHTML += `<option value="${i}-${j}">ITEM ${i}-${j}</option>`;
            }
        })();
    </script>
</body>
</html>
