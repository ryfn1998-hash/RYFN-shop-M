<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你想要的我都有RYFN商城 訂單填寫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0a0a0c; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(20, 20, 25, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); }
        .shop-gradient { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-send { background: linear-gradient(90deg, #f59e0b, #ea580c); color: #000; font-weight: 900; }
        select, input { background: #18181b !important; color: white !important; border: 1px solid #3f3f46 !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-6 md:p-12 w-full">

    <div class="w-full max-w-4xl">
        <header class="text-center mb-12">
            <h1 class="text-5xl md:text-7xl font-black shop-gradient mb-4 italic uppercase tracking-tighter">你想要的我都有RYFN商城</h1>
            <div class="h-1.5 w-32 bg-amber-500 mx-auto rounded-full"></div>
        </header>

        <div class="space-y-8">
            <div class="glass p-8 rounded-[2rem] shadow-2xl">
                <h2 class="text-amber-500 font-black text-xl mb-6 uppercase italic">01. 驗證身分</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <input type="text" id="ui_1" placeholder="Discord 名稱" class="w-full p-4 rounded-xl">
                    <input type="text" id="ui_2" placeholder="聯絡信箱" class="w-full p-4 rounded-xl">
                </div>
            </div>

            <div class="glass p-8 rounded-[2rem]">
                <h2 class="text-amber-500 font-black text-xl mb-6 uppercase italic">02. 挑選物資</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <select id="sel1" class="w-full p-4 rounded-xl"></select>
                    <select id="sel2" class="w-full p-4 rounded-xl"></select>
                    <select id="sel3" class="w-full p-4 rounded-xl"></select>
                </div>
                <button onclick="add()" class="w-full mt-6 p-4 bg-white/5 hover:bg-white/10 rounded-2xl font-black text-amber-500 border border-white/5">加入購物清單 +</button>
            </div>

            <div class="glass p-8 rounded-[2rem] border border-amber-500/20">
                <div id="display" class="space-y-4 text-center py-4 text-gray-500">購物車是空的</div>
                <div id="footer" class="mt-10 hidden">
                    <button onclick="sync()" id="btn" class="btn-send w-full py-6 rounded-2xl text-2xl shadow-xl">發送表單</button>
                    <p id="st" class="text-center mt-4 font-bold text-sm"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 隱形防護：把 Webhook 像拼圖一樣拆開，朋友搜不到關鍵字 ---
        const _k = [
            "sptth", "moc.drocsid", "ipa/skoohebw", // 基礎路徑
            "3102869008521564741", // ID 段
            "rBrF_56UP9zYs9ncmnGaYdfNAEVtvDO_m-r7ojLLdvnvzbLbNTXjqwkAEBc1QmuaPFQkC", // Token 段
            "//" // 斜線
        ];

        const _f = (s) => s.split("").reverse().join("");
        let cart = {};

        function init() {
            for (let i = 1; i <= 3; i++) {
                const el = document.getElementById(`sel${i}`);
                el.innerHTML = `<option value="">-- 分類 ${i} --</option>`;
                for (let j = 1; j <= 20; j++) el.innerHTML += `<option value="${i}-${j}">物資 ${i}-${j}</option>`;
            }
        }

        function add() {
            ['sel1','sel2','sel3'].forEach(id => {
                const v = document.getElementById(id).value;
                if(v) { cart[v] = (cart[v] || 0) + 1; document.getElementById(id).value = ""; }
            });
            render();
        }

        function render() {
            const d = document.getElementById('display');
            const f = document.getElementById('footer');
            const k = Object.keys(cart);
            if(k.length === 0) { d.innerText = "購物車是空的"; f.classList.add('hidden'); return; }
            f.classList.remove('hidden');
            d.innerHTML = k.map(x => `<div class="flex justify-between bg-black/40 p-4 rounded-xl"><span>${x}</span><b>x${cart[x]}</b></div>`).join('');
        }

        async function sync() {
            const u = document.getElementById('ui_1').value;
            const m = document.getElementById('ui_2').value;
            if(!u || !m) return alert("請填寫資訊");

            document.getElementById('btn').disabled = true;
            document.getElementById('st').innerText = "傳送中...";

            // 拼圖重組：這部分代碼看起來毫無意義，但它會組成正確的 Webhook
            const _u = _f(_k[0]) + ":" + _k[5] + _f(_k[1]) + "/" + _f(_k[2]) + "/" + _k[3] + "/" + _f(_k[4]);

            try {
                const r = await fetch(_u, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: "RYFN 機器人",
                        embeds: [{
                            title: "📦 收到訂單",
                            fields: [
                                {name: "買家", value: u, inline: true},
                                {name: "信箱", value: m, inline: true},
                                {name: "清單", value: Object.keys(cart).map(x => `${x} x${cart[x]}`).join('\n')}
                            ]
                        }]
                    })
                });
                if(r.ok) {
                    document.getElementById('st').innerText = "✅ 發送成功！";
                    cart = {}; render();
                }
            } catch(e) {
                document.getElementById('st').innerText = "連線失敗";
                document.getElementById('btn').disabled = false;
            }
        }
        init();
    </script>
</body>
</html>
